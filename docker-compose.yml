services:
  db:
    image: postgres:18.3-alpine
    container_name: w2w-db
    environment:
      POSTGRES_DB: w2wdb
      POSTGRES_USER: w2wuser
      POSTGRES_PASSWORD: w2wpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w2wuser -d w2wdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
