spring.datasource.driverClassName=org.postgresql.Driver
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${APP_SHOW_SQL:true}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.keystore.path=classpath:w2w-keystore.p12
jwt.keystore.password=w2wpass
jwt.keystore.alias=w2w-jwt
jwt.key.password=w2wpass
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Kafka properties
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.notification-topic=${KAFKA_NOTIFICATIONS_TOPIC:notifications-topic}

# Mail properties (using Google SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
