openapi: 3.0.3
info:
  title: Work2Work API
  version: 0.0.1
  description: OpenAPI specification for the current scheduling endpoints and response shapes.
servers:
  - url: http://localhost:8080
paths:
  /api/scheduling/shift-colors:
    get:
      summary: List available shift colors
      responses:
        '200':
          description: Available shift color identifiers and display values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftColorResponse'
  /api/scheduling/shifts:
    post:
      summary: Create a shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '201':
          description: Shift created
  /api/scheduling/shifts/{shiftId}:
    get:
      summary: Get a shift by id
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: Shift details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
    put:
      summary: Update a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftRequest'
      responses:
        '200':
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
    delete:
      summary: Soft-delete a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: Shift deleted
  /api/scheduling/employees:
    get:
      deprecated: true
      summary: Get grouped shifts in range
      parameters:
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: positionIds
          required: false
          explode: true
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: categoryIds
          required: false
          explode: true
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: Employees with grouped daily shift buckets and optional position/category filtering
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeWithShifts'
  /api/scheduling/shifts/employees:
    get:
      summary: Get grouped shifts in range
      parameters:
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: positionIds
          required: false
          explode: true
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: categoryIds
          required: false
          explode: true
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: Employees with grouped daily shift buckets, formatted day labels, short category labels, publish-status metadata, and optional position/category filtering
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeWithShifts'
  /api/scheduling/shifts/date-position:
    get:
      summary: Get shifts grouped by date and position
      parameters:
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: positionIds
          required: false
          explode: true
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: categoryIds
          required: false
          explode: true
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: Wrapped date-position summary for the requested range, including filtered totals and per-day buckets with split weekday/date fields. Shifts within each date/position bucket are ordered by start time, then last name and first name with null names first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatePositionSummaryResponse'
  /api/scheduling/shifts/grouped:
    get:
      summary: Get shifts grouped by date and the requested grouping strategy
      parameters:
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
        - in: query
          name: grouping
          required: true
          schema:
            type: string
            enum:
              - position
              - position_shift_timings
              - shift_timings
              - category_shift_timings
              - cat_shift_timings
        - in: query
          name: positionIds
          required: false
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: categoryIds
          required: false
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Grouped shifts in one normalized structure. Results are always grouped by date first, then by the requested grouping strategy under `shiftGroups`. Position grouping is ordered by position, start time, last name, and first name. Category and CAT grouping put no/null category first, then sort by category/CAT label, start time, last name, and first name. Shift-timing grouping is ordered by start time, last name, and first name. Name sorting puts null names first.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GroupedShiftsResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/DayPositionBucket'
                  - type: array
                    items:
                      $ref: '#/components/schemas/DayPositionTimingBucketDto'
                  - type: array
                    items:
                      $ref: '#/components/schemas/DayShiftTimingBucketDto'
                  - type: array
                    items:
                      $ref: '#/components/schemas/DayCategoryTimingBucketDto'
  /api/preferences/day:
    get:
      summary: Get day preference
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayPreferenceResponse'
    post:
      summary: Create or update day preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayPreferenceRequest'
      responses:
        '200':
          description: OK
  /api/preferences/day/range:
    get:
      summary: Get day preferences in range
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayPreferenceResponse'
  /api/preferences/day/repeat:
    post:
      summary: Create repeating day preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayPreferenceRepeatRequest'
      responses:
        '200':
          description: OK
  /api/preferences/day/list:
    post:
      summary: Update multiple day preferences in a single call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayPreferenceListRequest'
      responses:
        '200':
          description: OK
  /api/preferences/resolved:
    get:
      summary: Get resolved preferences for a date range
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResolvedPreferenceResponse'
  /api/time-off/requests:
    get:
      summary: Get time off requests for a company
      parameters:
        - in: query
          name: employeeId
          required: false
          schema:
            type: integer
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - all
              - pending
              - approved
              - declined
              - cancelled
            default: all
        - in: query
          name: startDate
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Time off requests in descending request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffRequestsResponse'
    post:
      summary: Create a time off request
      description: Employees can create requests for themselves; managers can create requests for any employee by setting employeeId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffRequest'
      responses:
        '201':
          description: Time off request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffSummary'
  /api/time-off/requests/{requestId}/cancel:
    put:
      summary: Cancel a time off request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Time off request cancelled successfully
  /api/time-off/requests/{requestId}/approve:
    put:
      summary: Approve or decline a time off request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTimeOffRequest'
      responses:
        '200':
          description: Time off request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffSummary'
  /api/positions:
    get:
      summary: Get positions for a company
      parameters:
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, inactive]
            default: active
      responses:
        '200':
          description: A list of positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
    post:
      summary: Create a new position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
      responses:
        '204':
          description: Position created successfully
  /api/positions/{id}:
    get:
      summary: Get an active position by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Position details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionSummary'
        '404':
          description: Position not found
    put:
      summary: Update an existing position
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
      responses:
        '204':
          description: Position updated successfully
        '404':
          description: Position not found
    delete:
      summary: Soft-delete a position
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Position soft-deleted successfully
        '404':
          description: Position not found
  /api/positions/{id}/restore:
    post:
      summary: Restore a soft-deleted position
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Position restored successfully
        '403':
          description: Forbidden
        '404':
          description: Position not found
  /api/categories:
    get:
      summary: Get categories for the authenticated tenant
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, inactive]
            default: active
      responses:
        '200':
          description: A list of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
    post:
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '204':
          description: Category created successfully
        '403':
          description: Forbidden
  /api/categories/{id}:
    get:
      summary: Get an active category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
    put:
      summary: Update an existing category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '204':
          description: Category updated successfully
        '403':
          description: Forbidden
        '404':
          description: Category not found
    delete:
      summary: Soft-delete a category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Category soft-deleted successfully
        '403':
          description: Forbidden
        '404':
          description: Category not found
  /api/category-groups:
    get:
      summary: Get category groups for the authenticated tenant
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, inactive]
            default: all
      responses:
        '200':
          description: A list of category groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryGroupsResponse'
    post:
      summary: Create a new category group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryGroupRequest'
      responses:
        '204':
          description: Category group created successfully
        '400':
          description: One or more categories were not found for the company
  /api/category-groups/{id}:
    get:
      summary: Get an active category group by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryGroupSummary'
        '404':
          description: Category group not found
    put:
      summary: Update an existing category group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryGroupRequest'
      responses:
        '204':
          description: Category group updated successfully
        '400':
          description: One or more categories were not found for the company
        '404':
          description: Category group not found
    delete:
      summary: Soft-delete a category group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Category group soft-deleted successfully
        '404':
          description: Category group not found
  /api/position-groups:
    get:
      summary: Get position groups for the authenticated tenant
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, inactive]
            default: all
      responses:
        '200':
          description: A list of position groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionGroupsResponse'
    post:
      summary: Create a new position group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionGroupRequest'
      responses:
        '204':
          description: Position group created successfully
        '400':
          description: One or more position ids were invalid for the company
  /api/position-groups/{id}:
    get:
      summary: Get an active position group by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Position group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionGroupSummary'
        '404':
          description: Position group not found
    put:
      summary: Update an existing position group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionGroupRequest'
      responses:
        '204':
          description: Position group updated successfully
        '400':
          description: One or more position ids were invalid for the company
        '404':
          description: Position group not found
    delete:
      summary: Soft-delete a position group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Position group soft-deleted successfully
        '404':
  /api/employees:
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
    post:
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '201':
          description: Employee created
        '409':
          description: Email already in use within the company
  /api/employees/{id}/view:
    get:
      summary: Get full employee details including positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detailed employee view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailResponse'
        '404':
          description: Employee not found
  /api/employees/config:
    get:
      summary: Get employee list configuration
      responses:
        '200':
          description: List of column configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeListConfigResponse'
    patch:
      summary: Save employee list configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
      responses:
        '200':
          description: Updated list of configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeListConfigResponse'
  /api/employees/{id}:
    get:
      summary: Get an employee by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailResponse'
        '404':
          description: Employee not found
    put:
      summary: Update an employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
    patch:
      summary: Partially update an employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee updated (partially)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
    delete:
      summary: Soft-delete an employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
  /api/managers/additional-managers:
    get:
      summary: Get all additional managers for a company
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of managers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagerResponse'
  /api/managers:
    post:
      summary: Add a new manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddManagerRequest'
      responses:
        '201':
          description: Manager created
  /api/managers/{id}:
    put:
      summary: Update manager permissions/details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagerRequest'
      responses:
        '204':
          description: Manager updated successfully
    delete:
      summary: Soft-delete a manager
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Manager deleted successfully
components:
  parameters:
    ShiftId:
      in: path
      name: shiftId
      required: true
      schema:
        type: integer
  schemas:
    CreateShiftRequest:
      type: object
      required: [date, startTime, endTime, position]
      properties:
        employeeId:
          type: integer
        companyId:
          type: integer
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          example: 9:00AM
        endTime:
          type: string
          example: 5:00PM
        duration:
          type: number
          format: float
        position:
          type: integer
        category:
          type: integer
        color:
          type: integer
          format: int32
          example: 1
    UpdateShiftRequest:
      type: object
      required: [date, startTime, endTime, position]
      properties:
        employeeId:
          type: integer
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          example: 10:00AM
        endTime:
          type: string
          example: 6:00PM
        duration:
          type: number
          format: float
        position:
          type: integer
        category:
          type: integer
        color:
          type: integer
          format: int32
          example: 2
    ShiftResponse:
      type: object
      properties:
        shiftId:
          type: integer
        employeeId:
